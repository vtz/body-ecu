# Overrides for Renode emulation.
# STM32H7 ADC calibration hangs in Renode -- the built-in STM32F0_ADC model
# doesn't implement the H7's DEEPPWD/ADVREGEN/ADCAL register sequence, so
# the Zephyr ADC driver spins forever during device init.
# Replacing the Renode ADC model requires PythonPeripheral peripheral
# overrides which are not reliably supported across Renode versions.
CONFIG_ADC=n
