name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBSW_REF: "82397e004ee1d8bd38426c5d25239bf986146ce5"

jobs:
  # ── Tier 1: standalone host builds (no OpenBSW / west / Zephyr) ────────
  posix-mpu:
    name: "Build: POSIX MPU"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build/posix-mpu -S platforms/posix-mpu

      - name: Build
        run: cmake --build build/posix-mpu -j$(nproc)

  autosd:
    name: "Build: AutoSD (MPU)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build/autosd -S platforms/autosd

      - name: Build
        run: cmake --build build/autosd -j$(nproc)

  # ── Tier 2: host builds that need OpenBSW sources ─────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenBSW
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/eclipse-openbsw/openbsw.git \
            "$GITHUB_WORKSPACE/../openbsw"
          git -C "$GITHUB_WORKSPACE/../openbsw" checkout ${{ env.OPENBSW_REF }}

      - name: Configure
        run: cmake -B build/tests -S tests/unit -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build/tests -j$(nproc)

      - name: Test
        run: ctest --test-dir build/tests --output-on-failure --output-junit test-results.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/tests/test-results.xml

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenBSW
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/eclipse-openbsw/openbsw.git \
            "$GITHUB_WORKSPACE/../openbsw"
          git -C "$GITHUB_WORKSPACE/../openbsw" checkout ${{ env.OPENBSW_REF }}

      - name: Install gcovr
        run: pip install gcovr

      - name: Configure (Debug + coverage)
        run: |
          cmake -B build/coverage -S tests/unit -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_C_FLAGS="--coverage"

      - name: Build
        run: cmake --build build/coverage -j$(nproc)

      - name: Test
        run: ctest --test-dir build/coverage --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr --root . --filter 'libs/' \
            --html coverage.html --xml coverage.xml \
            --print-summary | tee coverage-summary.txt

      - name: Coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.html
            coverage.xml

  posix-build:
    name: "Build: POSIX (Linux)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenBSW
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/eclipse-openbsw/openbsw.git \
            "$GITHUB_WORKSPACE/../openbsw"
          git -C "$GITHUB_WORKSPACE/../openbsw" checkout ${{ env.OPENBSW_REF }}

      - name: Configure (single-process)
        run: cmake -B build/posix -S platforms/posix

      - name: Build (single-process)
        run: cmake --build build/posix -j$(nproc)

      - name: Configure (MCU)
        run: cmake -B build/posix-mcu -S platforms/posix-mcu

      - name: Build (MCU)
        run: cmake --build build/posix-mcu -j$(nproc)

  # ── Real-adapter build (mirrors RPM path without rpmbuild overhead) ──
  real-adapters:
    name: "Build: Real Adapters (AutoSD)"
    runs-on: ubuntu-22.04
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake gcc-c++ git-core \
            systemd-devel \
            grpc-devel grpc-plugins \
            protobuf-devel protobuf-compiler \
            openssl-devel python3-pyyaml

      - name: Configure (real adapters)
        run: cmake -B build/autosd-real -S platforms/autosd -DBODY_ECU_REAL_ADAPTERS=ON

      - name: Build
        run: cmake --build build/autosd-real -j$(nproc)

  # ── RPM build validation ─────────────────────────────────────────────
  rpm-build:
    name: "RPM: Build Validation"
    runs-on: ubuntu-22.04
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build rpmdevtools \
            cmake gcc-c++ git-core \
            systemd-rpm-macros systemd-devel \
            grpc-devel grpc-plugins \
            protobuf-devel protobuf-compiler \
            openssl-devel patchelf python3-pyyaml

      - name: Setup rpmbuild tree
        run: rpmdev-setuptree

      - name: Create source tarball
        run: |
          VERSION=$(rpmspec -q --queryformat '%{version}' packaging/body-ecu-hpc.spec)
          tar czf ~/rpmbuild/SOURCES/body-ecu-hpc-${VERSION}.tar.gz \
            --transform "s,^\.,body-ecu-hpc-${VERSION}," \
            --exclude=build --exclude=.git .

      - name: Build RPM
        run: rpmbuild -ba packaging/body-ecu-hpc.spec

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: ~/rpmbuild/RPMS/**/*.rpm

  # ── Integration tests (two-process POSIX) ────────────────────────────
  integration-posix:
    name: "Integration: Two-Process POSIX"
    runs-on: ubuntu-22.04
    needs: posix-build
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenBSW
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/eclipse-openbsw/openbsw.git \
            "$GITHUB_WORKSPACE/../openbsw"
          git -C "$GITHUB_WORKSPACE/../openbsw" checkout ${{ env.OPENBSW_REF }}

      - name: Setup vCAN interface
        run: |
          sudo modprobe vcan || true
          sudo ip link add dev vcan0 type vcan || true
          sudo ip link set up vcan0 || true

      - name: Build POSIX MCU
        run: |
          cmake -B build/posix-mcu -S platforms/posix-mcu
          cmake --build build/posix-mcu -j$(nproc)

      - name: Build POSIX MPU
        run: |
          cmake -B build/posix-mpu -S platforms/posix-mpu
          cmake --build build/posix-mpu -j$(nproc)

      - name: Install pytest
        run: pip install pytest

      - name: Run two-process integration tests
        run: |
          pytest tests/integration/test_two_process.py \
            --mcu-bin=build/posix-mcu/body_ecu_posix_mcu \
            --mpu-bin=build/posix-mpu/body_ecu_posix_mpu \
            -v --tb=short --junit-xml=integration-results.xml
        timeout-minutes: 5

      - name: Run cloud gateway integration tests
        run: |
          pytest tests/integration/test_cloud_gateway.py \
            --mcu-bin=build/posix-mcu/body_ecu_posix_mcu \
            --mpu-bin=build/posix-mpu/body_ecu_posix_mpu \
            -v --tb=short --junit-xml=cloud-gateway-results.xml
        timeout-minutes: 5

      - name: Run SOME/IP lighting integration tests
        continue-on-error: true
        run: |
          pytest tests/integration/test_lighting.py \
            --mcu-bin=build/posix-mcu/body_ecu_posix_mcu \
            --mpu-bin=build/posix-mpu/body_ecu_posix_mpu \
            -v --tb=short --junit-xml=lighting-results.xml
        timeout-minutes: 3

      - name: Run SOME/IP door lock integration tests
        continue-on-error: true
        run: |
          pytest tests/integration/test_door_lock.py \
            --mcu-bin=build/posix-mcu/body_ecu_posix_mcu \
            --mpu-bin=build/posix-mpu/body_ecu_posix_mpu \
            -v --tb=short --junit-xml=door-lock-results.xml
        timeout-minutes: 3

      - name: Publish integration test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          check_name: "Integration Test Results"
          files: |
            integration-results.xml
            cloud-gateway-results.xml
            lighting-results.xml
            door-lock-results.xml

  # ── Tier 3: Zephyr build matrix (native_sim validated in CI) ──────────
  load-matrix:
    name: Load Build Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: echo "matrix=$(jq -c . build_matrix.json)" >> $GITHUB_OUTPUT

  zephyr-build:
    name: "Build: ${{ matrix.board }}"
    runs-on: ${{ matrix.runner }}
    needs: load-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install west and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1

      - name: Cache west workspace
        uses: actions/cache@v4
        with:
          path: |
            ../zephyr
            ../modules
            ../bootloader
            ../tools
          key: west-${{ hashFiles('west.yml') }}
          restore-keys: west-

      - name: Initialize west workspace
        run: |
          west init -l . || true
          west update --narrow --fetch-opt=--depth=1

      - name: Build
        run: west build -b ${{ matrix.board }} app

      - name: Sanitize board name
        if: contains(matrix.board, 'nucleo')
        id: board
        run: echo "slug=$(echo '${{ matrix.board }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Upload firmware artifact
        if: contains(matrix.board, 'nucleo')
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.board.outputs.slug }}
          path: build/zephyr/zephyr.*

  # Renode smoke test — blocked on reliable Renode install + firmware
  # artifact availability. Enable once zephyr-build reliably produces
  # nucleo firmware and Renode is cached/containerized.
