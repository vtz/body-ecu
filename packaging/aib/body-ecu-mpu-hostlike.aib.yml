# Body ECU MPU host-like AutoSD image profile.
# Reference baseline: sample-images/images/developer-someip.aib.yml

name: body-ecu-mpu-hostlike

content:
  enable_repos:
    - devel
  repos:
    # Local repository generated by packaging/build-rpm.sh mpu-hostlike <arch>
    - id: body-ecu-local
      baseurl: ../../build/rpm-repo/mpu-hostlike
      priority: 1
  rpms:
    - body-ecu-mpu-hostlike
    - "@Development Tools"

    # Convenience + debug tooling
    - bash-completion
    - chrony
    - dnf
    - less
    - strace
    - sudo
    - vim
    - git
    - wget
    - ninja-build
    - cmake
    - gdb
    - valgrind

    # Networking / SOME-IP diagnostics
    - NetworkManager
    - openssh-clients
    - openssh-server
    - iputils
    - iproute
    - net-tools
    - tcpdump
    - socat
    - ethtool
    - wireshark-cli

    # Helper tooling for scripts and test clients
    - python3
    - python3-pip
    - python3-pytest

  systemd:
    enabled_services:
      - sshd.service
      - chronyd.service
      - NetworkManager.service

auth:
  # Password: "password"
  root_password: $6$xoLqEUz0cGGJRx01$H3H/bFm0myJPULNMtbSsOFd/2BnHqHkMD92Sfxd.EKM9hXTWSmELG8cf205l6dktomuTcgKGGtGDgtvHVXSWU.

  sshd_config:
    PasswordAuthentication: true
    PermitRootLogin: true

  groups:
    dev:
      gid: 1000
  users:
    dev:
      password: $6$xoLqEUz0cGGJRx01$H3H/bFm0myJPULNMtbSsOFd/2BnHqHkMD92Sfxd.EKM9hXTWSmELG8cf205l6dktomuTcgKGGtGDgtvHVXSWU.
      uid: 1000
      gid: 1000

# Default static network for QEMU user-mode profile.
# Override if using TAP/vnet with different addressing.
network:
  static:
    ip: "10.0.2.15"
    ip_prefixlen: 24
    gateway: "10.0.2.2"
    dns: "10.0.2.3"
    iface: "enp0s3"
    load_module: "virtio_net"
