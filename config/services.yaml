network:
  host: "0.0.0.0"
  port: 30490
  sd:
    multicast_address: "239.255.255.251"
    multicast_port: 30490
    cyclic_offer_delay_ms: 5000

services:
  lighting:
    service_id: 0x1000
    instance_id: 0x0001
    methods:
      set_light_state: 0x0001
      get_light_status: 0x0002
    events:
      light_status_changed: 0x8001
    eventgroups:
      lighting_events: 0x0001

  door_lock:
    service_id: 0x1001
    instance_id: 0x0001
    methods:
      lock: 0x0001
      unlock: 0x0002
      get_status: 0x0003
    events:
      lock_state_changed: 0x8001
    eventgroups:
      door_events: 0x0001

  cloud_gateway:
    vin: "WVWZZZ3CZWE000001"
    nats_url: "nats://localhost:4222"
    subjects:
      command_door_lock: "vehicles.{vin}.command.door.lock"
      command_door_response: "vehicles.{vin}.command.door.response"
      state_door_locked: "vehicles.{vin}.state.door.locked"
      state_vehicle_mode: "vehicles.{vin}.state.vehicle.mode"
      state_vehicle_speed: "vehicles.{vin}.state.vehicle.speed"
      state_lights_status: "vehicles.{vin}.state.lights.status"

  vehicle_mode:
    service_id: 0x1002
    instance_id: 0x0001
    fields:
      mode:
        getter: 0x0001
        setter: 0x0002
        notifier: 0x8001
    eventgroups:
      mode_events: 0x0001

  vehicle_info:
    service_id: 0x1004
    instance_id: 0x0001
    methods:
      get_vin: 0x0001

  speed_sensor:
    service_id: 0x1003
    instance_id: 0x0001
    methods:
      get_speed: 0x0001
      set_speed: 0x0002   # Override speed (-1.0 to resume ADC)
    events:
      speed_changed: 0x8001
    eventgroups:
      speed_events: 0x0001
